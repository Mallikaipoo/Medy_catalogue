services:
  db:
    image: postgres:16-alpine
    container_name: medycatalog-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medycatalog}
      POSTGRES_USER: ${POSTGRES_USER:-medycatalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medycatalog_dev}
    ports:
      - "5432:5432"
    volumes:
      - medycatalog_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medycatalog} -d ${POSTGRES_DB:-medycatalog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: medycatalog-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - medycatalog_redis:/data

  minio:
    image: minio/minio:latest
    container_name: medycatalog-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-medycatalog}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-medycatalog_devpass}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - medycatalog_minio:/data

volumes:
  medycatalog_pg:
  medycatalog_redis:
  medycatalog_minio:
